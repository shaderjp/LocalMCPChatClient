name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check tracked file sizes
        shell: pwsh
        run: ./scripts/check-large-files.ps1
      - name: Restore
        run: dotnet restore LocalMCPChatClient.sln
      - name: Build
        run: dotnet build LocalMCPChatClient.sln -c Release --no-restore
      - name: Test
        run: dotnet test LocalMCPChatClient.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish portable application
        run: dotnet publish src/LocalMCPChatClient.App/LocalMCPChatClient.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/LocalMCPChatClient-win-x64.zip
          $hash = (Get-FileHash artifacts/LocalMCPChatClient-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LocalMCPChatClient-win-x64.zip" | Set-Content artifacts/LocalMCPChatClient-win-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LocalMCPChatClient-win-x64
          path: |
            artifacts/LocalMCPChatClient-win-x64.zip
            artifacts/LocalMCPChatClient-win-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalMCPChatClient-win-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
