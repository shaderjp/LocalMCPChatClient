name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Directory.Build.props のVersionがSemVer形式ではありません: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "タグ $env:GITHUB_REF_NAME とアプリバージョン v$version が一致しません。"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Check tracked file sizes
        shell: pwsh
        run: ./scripts/check-large-files.ps1
      - name: Restore
        run: dotnet restore LocalMCPChatClient.sln
      - name: Build
        run: dotnet build LocalMCPChatClient.sln -c Release --no-restore
      - name: Test
        run: dotnet test LocalMCPChatClient.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish portable application
        run: dotnet publish src/LocalMCPChatClient.App/LocalMCPChatClient.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable
      - name: Publish single-file application
        run: dotnet publish src/LocalMCPChatClient.App/LocalMCPChatClient.App.csproj -c Release -p:PublishProfile=win-x64-single-file -o artifacts/single-file
      - name: Verify license disclosures in publish outputs
        shell: pwsh
        run: |
          $requiredFiles = @(
            'LICENSE.txt',
            'THIRD-PARTY-NOTICES.txt',
            'licenses/APACHE-2.0.txt',
            'licenses/DOTNET-LIBRARY-LICENSE.txt',
            'licenses/DOTNET-RUNTIME-LICENSE.txt',
            'licenses/DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt',
            'licenses/MCP-CSHARP-SDK-LICENSE.txt',
            'licenses/MCP-CSHARP-SDK-THIRD-PARTY-NOTICES.txt',
            'licenses/WINDOWS-SDK-LICENSE.txt'
          )

          foreach ($outputDirectory in @('artifacts/portable', 'artifacts/single-file')) {
            foreach ($relativePath in $requiredFiles) {
              $path = Join-Path $outputDirectory $relativePath
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "ライセンス文書がpublish出力にありません: $path"
              }
            }
          }
      - name: Create release assets and checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $zipPath = "artifacts/LocalMCPChatClient-$version-win-x64.zip"
          $exePath = "artifacts/LocalMCPChatClient-$version-win-x64.exe"
          $licensePath = "artifacts/LocalMCPChatClient-$version-LICENSE.txt"
          $noticePath = "artifacts/LocalMCPChatClient-$version-THIRD-PARTY-NOTICES.txt"
          $singleFileSource = 'artifacts/single-file/LocalMCPChatClient.exe'

          if (-not (Test-Path $singleFileSource)) {
            throw "単体EXEが生成されていません: $singleFileSource"
          }

          Compress-Archive -Path artifacts/portable/* -DestinationPath $zipPath
          Copy-Item -LiteralPath $singleFileSource -Destination $exePath
          Copy-Item -LiteralPath LICENSE -Destination $licensePath
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.txt -Destination $noticePath

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
          try {
            $entryNames = @($archive.Entries | ForEach-Object FullName)
            foreach ($requiredEntry in @('LICENSE.txt', 'THIRD-PARTY-NOTICES.txt', 'licenses/APACHE-2.0.txt')) {
              if ($requiredEntry -notin $entryNames) {
                throw "Portable ZIPにライセンス文書がありません: $requiredEntry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          $versionInfo = (Get-Item -LiteralPath $exePath).VersionInfo
          $numericVersion = ($version -split '-', 2)[0]
          if ($versionInfo.FileVersion -ne "$numericVersion.0" -or $versionInfo.ProductVersion -ne $version) {
            throw "EXEのバージョンが一致しません: File=$($versionInfo.FileVersion), Product=$($versionInfo.ProductVersion)"
          }

          foreach ($path in @($zipPath, $exePath)) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))" | Set-Content "$path.sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalMCPChatClient-release-assets
          path: |
            artifacts/LocalMCPChatClient-*-win-x64.zip
            artifacts/LocalMCPChatClient-*-win-x64.zip.sha256
            artifacts/LocalMCPChatClient-*-win-x64.exe
            artifacts/LocalMCPChatClient-*-win-x64.exe.sha256
            artifacts/LocalMCPChatClient-*-LICENSE.txt
            artifacts/LocalMCPChatClient-*-THIRD-PARTY-NOTICES.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalMCPChatClient-release-assets
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: LocalMCPChatClient ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
